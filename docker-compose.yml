services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siagakarta}
      DB_USERNAME: ${DB_USERNAME:-siagakarta}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      RUN_MIGRATIONS: "true"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.29.0.30}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - siagakarta_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks: [siagakarta]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-siagakarta}
      MYSQL_USER: ${DB_USERNAME:-siagakarta}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - siagakarta_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [siagakarta]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siagakarta}
      DB_USERNAME: ${DB_USERNAME:-siagakarta}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - siagakarta_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    networks: [siagakarta]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN wajib diisi untuk profile cloudflare}
    command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:2000 run
    depends_on:
      app:
        condition: service_healthy
    networks:
      siagakarta:
        ipv4_address: 172.29.0.30

volumes:
  siagakarta_mysql:
  siagakarta_storage:

networks:
  siagakarta:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
